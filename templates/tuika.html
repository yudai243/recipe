<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>レシピ追加</title>
</head>
<body>
    <h1>レシピの追加</h1>
    <!-- 事実：フォームの送信先（action）やメソッド（method）は、サーバー側の設計に合わせて書き換える必要がある -->
    <form action="/add" method="POST">
        <label for="genre">料理のジャンル:</label>
        <select id="genre" name="genre">
            <option value="和食">和食</option>
            <option value="洋食">洋食</option>
            <option value="中華">中華</option>
        </select><br><br>

        <label for="recipe_name">料理名:</label>
        <input type="text" id="recipe_name" name="recipe_name" required><br><br>

        <label for="steps">手順:</label><br>
        <textarea id="steps" name="steps" rows="5" cols="40" required></textarea><br><br>

        <button type="submit">追加する</button>
    </form>
    <br>
    <a href="index.html">一覧に戻る</a>
</body>
</html>
